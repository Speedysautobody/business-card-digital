<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#05070a">
<title>Speedy's Auto Body | Erick</title>
<style>
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;font-family:Arial,Helvetica,sans-serif;color:#fff;background:
radial-gradient(circle at 50% -10%,#16314b 0,transparent 30%),
linear-gradient(180deg,#05070a,#090b0f 55%,#020305);min-height:100vh}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.22;background-image:
linear-gradient(30deg,#111 12%,transparent 12.5%,transparent 87%,#111 87.5%,#111),
linear-gradient(150deg,#111 12%,transparent 12.5%,transparent 87%,#111 87.5%,#111);
background-size:32px 56px}
.card{width:min(100%,470px);min-height:100vh;margin:auto;position:relative;overflow:hidden;
background:linear-gradient(180deg,rgba(8,10,14,.94),rgba(2,3,5,.98));box-shadow:0 0 70px #000}
.topbar{display:flex;justify-content:flex-end;padding:18px 18px 0}
.lang{display:flex;border:1px solid #67717e;border-radius:24px;overflow:hidden;background:#050505}
.lang button{border:0;color:#aaa;background:transparent;padding:9px 15px;font-weight:800;font-size:14px}
.lang button.active{color:#fff;background:linear-gradient(180deg,#147cff,#06388f);box-shadow:0 0 14px #168cff}
.hero{padding:4px 16px 8px;text-align:center}
.logo{width:94%;max-height:300px;object-fit:contain;filter:drop-shadow(0 8px 18px #000)}
.owner{margin:0 16px 16px;padding:12px;border:1px solid #606772;border-radius:18px;
background:linear-gradient(135deg,#15191f,#050607);box-shadow:inset 0 0 20px #000,0 0 12px #111}
.owner h1{margin:0;font-size:34px;letter-spacing:.5px;text-transform:uppercase}
.owner p{margin:3px 0 0;font-size:17px;letter-spacing:3px;color:#d9d9d9;text-transform:uppercase}
.actions{padding:0 16px;display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.btn{min-height:82px;border-radius:18px;border:1px solid #59616c;background:linear-gradient(180deg,#12161c,#030405);
color:#fff;text-decoration:none;display:flex;flex-direction:column;align-items:center;justify-content:center;
font-weight:800;font-size:13px;box-shadow:inset 0 0 18px #000,0 0 10px rgba(0,180,255,.18)}
.btn .ico{font-size:28px;margin-bottom:6px}.call{border-color:#1cff51;box-shadow:0 0 12px #0b7}
.text{border-color:#12aaff}.directions{border-color:#ff2e86}.website{border-color:#ffb300}
.save{border-color:#d5d5d5}.share{border-color:#b536ff}
.wide{grid-column:span 3;min-height:62px;flex-direction:row;gap:12px;font-size:16px}
.info{margin:16px;border:1px solid #69717b;border-radius:18px;background:#050608;display:grid;
grid-template-columns:1fr 1fr 1fr;overflow:hidden;box-shadow:inset 0 0 22px #000}
.info div{padding:14px 6px;text-align:center;border-right:1px solid #3a414a}.info div:last-child{border:0}
.info b{display:block;font-size:12px;margin-top:7px}.info span{display:block;font-size:11px;color:#bbb;margin-top:4px}
.info .sym{font-size:25px;color:#19d9ff}
.address{margin:0 16px 14px;padding:12px 14px;border-radius:15px;background:#0b0d11;border:1px solid #303842;
text-align:center;font-size:13px;color:#ddd}.address a{color:#fff;text-decoration:none}
.socials{display:flex;justify-content:center;gap:17px;padding:4px 16px 18px}
.social{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;color:white;text-decoration:none;
font-weight:900;font-size:20px;border:2px solid #555;background:#111;box-shadow:0 0 12px #111}
.p{border-color:#e60023}.t{border-color:#25f4ee}.f{border-color:#1877f2}.i{border-color:#e1306c}
.site{margin:0 16px 22px;padding:14px;border:1px solid #138cff;border-radius:18px;text-align:center;
background:linear-gradient(90deg,#06162b,#09060f);box-shadow:0 0 15px rgba(0,130,255,.25)}
.site a{color:#fff;text-decoration:none;font-weight:800}.footer{text-align:center;color:#666;font-size:10px;padding:0 0 22px}
@media(max-width:380px){.owner h1{font-size:29px}.btn{min-height:76px}.info{margin:13px}.info b{font-size:10px}}
</style>
</head>
<body>
<main class="card">
 <div class="topbar"><div class="lang"><button id="en" class="active" onclick="setLang('en')">EN</button><button id="es" onclick="setLang('es')">ES</button></div></div>
 <section class="hero"><img class="logo" src="Speedys.png" alt="Speedy's Auto Body Collision Repair LLC"></section>
 <section class="owner"><h1>Erick</h1><p data-en="Owner" data-es="Propietario">Owner</p></section>
 <section class="actions">
   <a class="btn call" href="tel:+18166959457"><span class="ico">☎</span><span data-en="Call Now" data-es="Llamar">Call Now</span></a>
   <a class="btn text" href="sms:+18166959457"><span class="ico">●●●</span><span data-en="Text" data-es="Mensaje">Text</span></a>
   <a class="btn directions" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=215%20N%20Scott%20Ave%20Suite%20A%2C%20Belton%2C%20MO%2064012"><span class="ico">⌖</span><span data-en="Directions" data-es="Cómo llegar">Directions</span></a>
   <a class="btn website" href="https://www.speedyautobody.com/" target="_blank" rel="noopener"><span class="ico">◎</span><span data-en="Website" data-es="Sitio web">Website</span></a>
   <button class="btn save" onclick="saveContact()"><span class="ico">▣</span><span data-en="Save Contact" data-es="Guardar contacto">Save Contact</span></button>
   <button class="btn share" onclick="shareCard()"><span class="ico">↗</span><span data-en="Share" data-es="Compartir">Share</span></button>
 </section>
 <section class="info">
   <div><div class="sym">☎</div><b>816-695-9457</b><span data-en="Phone Number" data-es="Teléfono">Phone Number</span></div>
   <div><div class="sym">▣</div><b data-en="Monday – Friday" data-es="Lunes – Viernes">Monday – Friday</b><span data-en="Work Days" data-es="Días de trabajo">Work Days</span></div>
   <div><div class="sym">◷</div><b>9:00 AM – 5:00 PM</b><span data-en="Work Hours" data-es="Horario">Work Hours</span></div>
 </section>
 <div class="address"><a target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=215%20N%20Scott%20Ave%20Suite%20A%2C%20Belton%2C%20MO%2064012">📍 215 N Scott Ave Suite A, Belton, MO 64012</a></div>
 <section class="socials" aria-label="Social media">
  <a class="social p" aria-label="Pinterest" target="_blank" rel="noopener" href="https://www.pinterest.com/speedyautobody/">P</a>
  <a class="social t" aria-label="TikTok" target="_blank" rel="noopener" href="https://www.tiktok.com/@speedys.auto.body">♪</a>
  <a class="social f" aria-label="Facebook" target="_blank" rel="noopener" href="https://www.facebook.com/SpeedysAutoBodyCollisionRepair/">f</a>
  <a class="social i" aria-label="Instagram" target="_blank" rel="noopener" href="https://www.instagram.com/speedys_autobody/">◎</a>
 </section>
 <div class="site">🌐 <a href="https://www.speedyautobody.com/" target="_blank" rel="noopener">www.speedyautobody.com</a></div>
 <div class="footer">SPEEDY'S AUTO BODY COLLISION REPAIR LLC</div>
</main>
<script>
function setLang(lang){
 document.documentElement.lang=lang;
 document.querySelectorAll('[data-en]').forEach(el=>el.textContent=el.dataset[lang]);
 document.getElementById('en').classList.toggle('active',lang==='en');
 document.getElementById('es').classList.toggle('active',lang==='es');
}
function saveContact(){
 const v=`BEGIN:VCARD
VERSION:3.0
FN:Erick
ORG:Speedy's Auto Body Collision Repair LLC
TITLE:Owner
TEL;TYPE=CELL:+18166959457
ADR;TYPE=WORK:;;215 N Scott Ave Suite A;Belton;MO;64012;USA
URL:https://www.speedyautobody.com/
END:VCARD`;
 const blob=new Blob([v],{type:'text/vcard'}),a=document.createElement('a');
 a.href=URL.createObjectURL(blob);a.download='Erick-Speedys-Auto-Body.vcf';a.click();URL.revokeObjectURL(a.href);
}
async function shareCard(){
 const data={title:"Speedy's Auto Body",text:"Speedy's Auto Body Collision Repair LLC",url:location.href};
 if(navigator.share){try{await navigator.share(data)}catch(e){}} else {
   try{await navigator.clipboard.writeText(location.href);alert('Link copied!')}catch(e){}
 }
}
</script>
</body>
</html>
